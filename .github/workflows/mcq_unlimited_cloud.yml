name: Unlimited 24x7 Cloud 20-Agent Nonstop MCQ, Passage, Figure & AI Staging Swarm

on:
  push:
    branches:
      - main
    paths:
      - "_mcq_engine/**"
      - ".github/workflows/mcq_unlimited_cloud.yml"
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Cloud VM ('ubuntu-latest' keyless 20-agent swarm) or 'self-hosted' (Google AI Ultra agy swarm)"
        required: false
        default: "ubuntu-latest"
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: mcq-unlimited-cloud-engine
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  multi-agent-cloud-swarm:
    runs-on: ${{ github.event.inputs.runner_mode || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Parquet, Image, Clean MathML & Keyless Multi-Agent Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 || true
          pip install --quiet pyarrow pillow beautifulsoup4 lxml langdetect latex2mathml "g4f[slim]" curl_cffi ddgs || pip install --quiet pyarrow pillow beautifulsoup4 lxml langdetect latex2mathml "g4f[slim]" ddgs

      - name: Run 20-Agent Nonstop Cloud Swarm
        run: |
          python -u _mcq_engine/public_cloud_runner.py

      - name: Guarantee 24x7 Checkpoint Persistence & Immediate Auto-Restart
        if: always() && job.status != 'cancelled'
        run: |
          python -c "import _mcq_engine.public_cloud_runner as r; r.upload_release_checkpoints()" || true
          gh workflow run mcq_unlimited_cloud.yml || true
