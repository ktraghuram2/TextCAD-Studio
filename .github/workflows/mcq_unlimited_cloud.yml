name: Unlimited 24x7 Cloud 16-Agent Nonstop MCQ, Passage, Figure & AI Staging Swarm

on:
  push:
    branches:
      - main
    paths:
      - "_mcq_engine/**"
      - ".github/workflows/mcq_unlimited_cloud.yml"
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Cloud VM ('ubuntu-latest' keyless 16-agent swarm) or 'self-hosted' (Google AI Ultra agy swarm)"
        required: false
        default: "ubuntu-latest"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: mcq-unlimited-cloud-engine
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  multi-agent-cloud-swarm:
    runs-on: ${{ github.event.inputs.runner_mode || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Parquet, Image, Clean MathML & Keyless Multi-Agent AI Swarm Dependencies
        run: |
          pip install --quiet pyarrow pillow beautifulsoup4 lxml langdetect latex2mathml "g4f[slim]" curl_cffi ddgs
          python -u _mcq_engine/public_cloud_runner.py
